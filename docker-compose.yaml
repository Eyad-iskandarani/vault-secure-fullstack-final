services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: secure-fullstack-database:latest
    container_name: secure-fullstack-database
    restart: unless-stopped

    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_SECRET_PATH: "kv/data/secure-fullstack"
      VAULT_TOKEN_FILE: "/run/secrets/vault_token"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./vault/token:/run/secrets/vault_token:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -p 5432
      interval: 5s
      timeout: 5s
      retries: 15

    networks:
      - secure-fullstack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: secure-fullstack-backend:latest
    container_name: secure-fullstack-backend
    restart: unless-stopped

    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_SECRET_PATH: "kv/data/secure-fullstack"
      VAULT_TOKEN_FILE: "/run/secrets/vault_token"

    volumes:
      - ./vault/token:/run/secrets/vault_token:ro

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 5s
      timeout: 5s
      retries: 15

    networks:
      - secure-fullstack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: secure-fullstack-frontend:latest
    container_name: secure-fullstack-frontend
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - secure-fullstack-network

volumes:
  postgres-data:

networks:
  secure-fullstack-network:
    name: secure-fullstack-network
    external: true
