name: Security Scanning Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  DATABASE_IMAGE: ghcr.io/eyad-iskandarani/vault-secure-fullstack-final-database:latest
  BACKEND_IMAGE: ghcr.io/eyad-iskandarani/vault-secure-fullstack-final-backend:latest
  FRONTEND_IMAGE: ghcr.io/eyad-iskandarani/vault-secure-fullstack-final-frontend:latest

jobs:
  security-scanning:
    name: Run Four Security Tools
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare reports directory
        run: |
          rm -rf security-reports
          mkdir -p security-reports

      - name: Run Hadolint
        run: |
          REPORT="security-reports/hadolint-report.txt"
          : > "${REPORT}"

          while IFS= read -r dockerfile; do
            {
              echo "=================================================="
              echo "HADOLINT SCAN: ${dockerfile}"
              echo "=================================================="
            } >> "${REPORT}"

            docker run --rm -i \
              hadolint/hadolint:latest-debian \
              < "${dockerfile}" \
              >> "${REPORT}" 2>&1 || true

            echo >> "${REPORT}"
          done < <(find . -type f -name Dockerfile | sort)

          if [ ! -s "${REPORT}" ]; then
            echo "Hadolint completed with no findings." > "${REPORT}"
          fi

      - name: Run Bandit
        run: |
          python3 -m venv .security-venv

          .security-venv/bin/python \
            -m pip install --quiet --upgrade pip

          .security-venv/bin/python \
            -m pip install --quiet bandit

          .security-venv/bin/bandit \
            --recursive backend \
            --format txt \
            --output security-reports/bandit-report.txt \
            || true

          if [ ! -s security-reports/bandit-report.txt ]; then
            echo "Bandit completed with no findings." \
              > security-reports/bandit-report.txt
          fi

      - name: Run TruffleHog
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repository:ro" \
            trufflesecurity/trufflehog:latest \
            git file:///repository \
            --no-update \
            > security-reports/trufflehog-report.txt \
            2>&1 || true

          if [ ! -s security-reports/trufflehog-report.txt ]; then
            echo "TruffleHog completed with no findings." \
              > security-reports/trufflehog-report.txt
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images for Trivy
        run: |
          docker pull "${DATABASE_IMAGE}"
          docker pull "${BACKEND_IMAGE}"
          docker pull "${FRONTEND_IMAGE}"

      - name: Run Trivy
        run: |
          REPORT="security-reports/trivy-report.txt"
          : > "${REPORT}"

          scan_image() {
            IMAGE_NAME="$1"
            IMAGE_LABEL="$2"

            {
              echo "=================================================="
              echo "TRIVY SCAN: ${IMAGE_LABEL}"
              echo "IMAGE: ${IMAGE_NAME}"
              echo "=================================================="
            } >> "${REPORT}"

            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest \
              image \
              --format table \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              "${IMAGE_NAME}" \
              >> "${REPORT}" 2>&1 || true

            echo >> "${REPORT}"
          }

          scan_image "${DATABASE_IMAGE}" "DATABASE"
          scan_image "${BACKEND_IMAGE}" "BACKEND"
          scan_image "${FRONTEND_IMAGE}" "FRONTEND"

      - name: List final reports
        if: always()
        run: |
          echo "The artifact will contain these files:"
          find security-reports \
            -maxdepth 1 \
            -type f \
            -name "*-report.txt" \
            -printf '%f\n' \
            | sort

      - name: Upload four security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports-${{ github.run_number }}
          path: |
            security-reports/hadolint-report.txt
            security-reports/bandit-report.txt
            security-reports/trufflehog-report.txt
            security-reports/trivy-report.txt
          if-no-files-found: error
          retention-days: 30
