name: Build and Deploy Secure Full-Stack Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DATABASE_IMAGE: ghcr.io/eyad-iskandarani/vault-secure-fullstack-final-database
  BACKEND_IMAGE: ghcr.io/eyad-iskandarani/vault-secure-fullstack-final-backend
  FRONTEND_IMAGE: ghcr.io/eyad-iskandarani/vault-secure-fullstack-final-frontend

jobs:
  build-and-push:
    name: Build and Push Images to GHCR
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build database image
        run: |
          docker build \
            --tag "${DATABASE_IMAGE}:latest" \
            --tag "${DATABASE_IMAGE}:${GITHUB_SHA}" \
            ./database

      - name: Build backend image
        run: |
          docker build \
            --tag "${BACKEND_IMAGE}:latest" \
            --tag "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --tag "${FRONTEND_IMAGE}:latest" \
            --tag "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            ./frontend

      - name: Push database image
        run: |
          docker push "${DATABASE_IMAGE}:latest"
          docker push "${DATABASE_IMAGE}:${GITHUB_SHA}"

      - name: Push backend image
        run: |
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Push frontend image
        run: |
          docker push "${FRONTEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"

  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Vault availability
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            http://127.0.0.1:8200/v1/sys/health \
            > /dev/null

          echo "Vault is running and unsealed."

      - name: Create restricted Vault token file
        env:
          VAULT_APP_TOKEN: ${{ secrets.VAULT_APP_TOKEN }}
        run: |
          if [ -z "${VAULT_APP_TOKEN}" ]; then
            echo "VAULT_APP_TOKEN is not configured."
            exit 1
          fi

          printf '%s' "${VAULT_APP_TOKEN}" > vault/token
          chmod 600 vault/token

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull application images
        run: |
          docker compose pull

      - name: Deploy application
        run: |
          docker compose down --remove-orphans
          docker compose up -d --no-build

      - name: Display container status
        run: |
          docker compose ps

      - name: Verify frontend
        run: |
          for attempt in $(seq 1 30); do
            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:8080/ \
              > /dev/null; then
              echo "Frontend verification succeeded."
              exit 0
            fi

            echo "Frontend attempt ${attempt}/30 failed."
            sleep 2
          done

          docker compose logs --tail=100
          exit 1

      - name: Verify API
        run: |
          curl \
            --silent \
            --show-error \
            --fail \
            http://127.0.0.1:8080/api/tasks \
            > /dev/null

          echo "API verification succeeded."
