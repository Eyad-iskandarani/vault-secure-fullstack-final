<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="A Vault-secured full-stack task manager"
    >
    <title>Secure Task Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="container">
        <section class="hero">
            <p class="label">Vault-Secured Application</p>
            <h1>Secure Task Manager</h1>
            <p>
                Flask, PostgreSQL, Nginx, Docker and HashiCorp Vault
            </p>
        </section>

        <section class="task-panel">
            <form id="task-form">
                <label for="task-title">Create a task</label>

                <div class="form-row">
                    <input
                        id="task-title"
                        name="title"
                        type="text"
                        maxlength="255"
                        placeholder="Enter a new task"
                        required
                    >
                    <button type="submit">Add task</button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div class="list-header">
                <h2>Your tasks</h2>
                <button id="refresh-button" class="secondary" type="button">
                    Refresh
                </button>
            </div>

            <ul id="task-list"></ul>
        </section>
    </main>

    <script src="/app.js" defer></script>
</body>
</html>
